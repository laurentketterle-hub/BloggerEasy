name: ci-multi-page-gen

on:
  push:
    branches: [master, main]
    paths:
      - 'src/bloggereasy/multi_page_generator.py'
      - 'tests/test_multi_page_generator.py'
  pull_request:
    paths:
      - 'src/bloggereasy/multi_page_generator.py'
      - 'tests/test_multi_page_generator.py'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/bloggereasy/multi_page_generator.py tests/test_multi_page_generator.py
      - name: Ruff format
        run: ruff format --check src/bloggereasy/multi_page_generator.py tests/test_multi_page_generator.py
      - name: Pytest multi-page gen
        run: pytest -q tests/test_multi_page_generator.py -v
